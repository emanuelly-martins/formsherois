<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <title>Heróis</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <h1>Academia de Heróis</h1>
            <small>Inscreva-se para participar da próxima missão.</small>
        </header>

        <main>
            <section id="intro">
                <form action="#" method="get">
                    <h2>Faça sua inscrição</h2>
                    <label for="nome">Nome de herói:</label>
                    <input id="nome" name="nome" type="text" />

                    <label for="email">E-mail:</label>
                    <input id="email" name="email" type="email" />

                    <label for="idade">Idade:</label>
                    <input id="idade" name="idade" type="number" />

                    <label for="equipe">Escolha sua equipe:</label>
                    <select id="equipe" name="equipe">
                        <option>Liga da Justiça</option>
                        <option>Vingadores</option>
                        <option>X-men</option>
                    </select>

                    <section id="opcoes">
                        <h3>Qual poder você prefere?</h3>

                        <article class="opcao">
                            <input id="voar" name="poder" type="radio" />
                            <label for="voar">Voar</label>
                        </article>

                        <article class="opcao">
                            <input id="supervelocidade" name="poder" type="radio" />
                            <label for="supervelocidade">Supervelocidade</label>
                        </article>

                        <article class="opcao">
                            <input id="superforca" name="poder" type="radio" />
                            <label for="superforca">Superforça</label>
                        </article>
                    </section>

                    <section id="missoes-pai">
                        <input id="missoes" name="missoes" type="checkbox" />
                        <label for="missoes">Quero receber novas missões.</label>
                    </section>

                    
                    <label for="descricao">Por que você quer ser um herói?</label>
                    <textarea id="descricao" name="descricao" rows="4"></textarea>

                    <button type="submit">Enviar inscrição</button>
                </form>
            </section>
        </main>

        <footer>
            <p>Prática de formulários HTML.</p>
        </footer>
    </body>
</html>
